services:
  - type: web
    name: moksha-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @moksha/api exec prisma migrate deploy && pnpm --filter @moksha/api build
    startCommand: pnpm --filter @moksha/api start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "4000"

      - key: API_PUBLIC_URL
        sync: false

      - key: WEB_ORIGIN
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        sync: false

      - key: STORAGE_PROVIDER
        value: supabase

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: SUPABASE_BUCKET
        value: moksha-uploads

      - key: PUBLIC_LEADS_API_KEY
        generateValue: true

      - key: GOOGLE_FORM_SHARED_SECRET
        generateValue: true

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: WHATSAPP_APP_SECRET
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_RENEWAL_TEMPLATE
        value: renewal_reminder
