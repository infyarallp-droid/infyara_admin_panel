# Checks every pull request and every push to main: typecheck, lint, build, and the API test suite.
# Render and Vercel deploy on their own; this workflow shows a ✓ or ✗ on each change.
# To stop a ✗ from reaching production, protect `main` in GitHub (Settings → Branches →
# require the "Typecheck, lint, build" and "API tests" checks) and merge through pull requests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in package.json ("packageManager").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installing does not generate the Prisma client; typecheck needs it.
      - name: Generate Prisma client
        run: pnpm --filter @moksha/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moksha
          POSTGRES_PASSWORD: moksha
          POSTGRES_DB: moksha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moksha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for this CI machine only — not real secrets. The tests create and use a
      # separate "moksha_test" database, and mock WhatsApp, Razorpay, Google and Claude locally.
      DATABASE_URL: postgresql://moksha:moksha@localhost:5432/moksha?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @moksha/api exec prisma generate
      - run: pnpm --filter @moksha/api test
